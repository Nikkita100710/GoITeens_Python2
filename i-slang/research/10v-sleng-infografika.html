<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Візуалізація результатів опитування</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .chart-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .infographic {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 20px;
            min-height: 300px;
        }
        .word-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.3s;
            cursor: pointer;
        }
        .word-item:hover {
            transform: scale(1.1);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-card .label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Результати опитування учнів 10-В класу</h1>
            <p>Дослідження використання англомовного інтернет-сленгу</p>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title">📊 Стовпчикова діаграма</div>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">🥧 Кругова діаграма</div>
                <canvas id="pieChart"></canvas>
            </div>
        </div>

        <div class="infographic">
            <div class="chart-title">☁️ Хмара популярності інтернет-виразів</div>
            <div class="word-cloud" id="wordCloud"></div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="number">30</div>
                    <div class="label">Респондентів</div>
                </div>
                <div class="stat-card">
                    <div class="number">75%</div>
                    <div class="label">Участь класу</div>
                </div>
                <div class="stat-card">
                    <div class="number">10</div>
                    <div class="label">Виразів досліджено</div>
                </div>
                <div class="stat-card">
                    <div class="number">126</div>
                    <div class="label">Загально голосів</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const data = [
            {emoji: '📝', term: 'IDK', translation: 'не знаю', votes: 22, percent: 73, color: '#FF6B6B'},
            {emoji: '😂', term: 'LOL', translation: 'голосно сміюся', votes: 20, percent: 66, color: '#4ECDC4'},
            {emoji: '🎮', term: 'AFK', translation: 'відійшов від клавіатури', votes: 20, percent: 66, color: '#45B7D1'},
            {emoji: '🕹️', term: 'LAG', translation: 'затримка мережі', votes: 20, percent: 66, color: '#96CEB4'},
            {emoji: '🐞', term: 'BUG', translation: 'помилка в програмі', votes: 14, percent: 46, color: '#FFEAA7'},
            {emoji: '🌐', term: 'BTW', translation: 'до речі', votes: 13, percent: 43, color: '#DFE6E9'},
            {emoji: '🤫', term: 'TBH', translation: 'чесно кажучи', votes: 7, percent: 23, color: '#A29BFE'},
            {emoji: '🔥', term: 'FOMO', translation: 'страх щось пропустити', votes: 4, percent: 13, color: '#FD79A8'},
            {emoji: '😊', term: 'IMO', translation: 'на мою думку', votes: 3, percent: 10, color: '#FDCB6E'},
            {emoji: '⏳', term: 'BRB', translation: 'зараз повернуся', votes: 3, percent: 10, color: '#6C5CE7'}
        ];

        // Стовпчикова діаграма
        const barCtx = document.getElementById('barChart').getContext('2d');
        new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: data.map(d => d.emoji + ' ' + d.term),
                datasets: [{
                    label: 'Кількість голосів',
                    data: data.map(d => d.votes),
                    backgroundColor: data.map(d => d.color),
                    borderColor: data.map(d => d.color),
                    borderWidth: 2,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `${context.parsed.y} голосів (${data[context.dataIndex].percent}%)`;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 25,
                        ticks: {
                            stepSize: 5
                        },
                        title: {
                            display: true,
                            text: 'Кількість голосів',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Інтернет-вирази',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        }
                    }
                }
            }
        });

        // Кругова діаграма
        const pieCtx = document.getElementById('pieChart').getContext('2d');
        new Chart(pieCtx, {
            type: 'pie',
            data: {
                labels: data.map(d => d.emoji + ' ' + d.term),
                datasets: [{
                    data: data.map(d => d.votes),
                    backgroundColor: data.map(d => d.color),
                    borderColor: '#fff',
                    borderWidth: 3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            font: {
                                size: 12
                            },
                            padding: 15
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.parsed || 0;
                                const percent = data[context.dataIndex].percent;
                                return `${label}: ${value} голосів (${percent}%)`;
                            }
                        }
                    }
                }
            }
        });

        // Хмара слів
        const wordCloud = document.getElementById('wordCloud');
        data.forEach(item => {
            const size = 0.8 + (item.votes / 22) * 2.2;
            const wordDiv = document.createElement('div');
            wordDiv.className = 'word-item';
            wordDiv.style.fontSize = `${size}em`;
            wordDiv.style.backgroundColor = item.color;
            wordDiv.style.color = '#fff';
            wordDiv.innerHTML = `<span>${item.emoji}</span><span>${item.term}</span>`;
            wordDiv.title = `${item.translation} — ${item.votes} голосів (${item.percent}%)`;
            wordCloud.appendChild(wordDiv);
        });
    </script>
</body>
</html>
